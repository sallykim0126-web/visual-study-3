<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>A Day at the Office</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      background: black;

      font-family: Arial, sans-serif;
    }


    body {
      overflow-x: hidden;
    }



    /* =========================================
       전체 화면
       ========================================= */

    .office {

      width: 100%;
      height: 100vh;

      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      background: black;

    }



    /* =========================================
       이미지가 들어가는 무대
       ========================================= */

    .stage {

      position: relative;

      width: min(
        100vw,
        calc(100vh * 1672 / 941)
      );

      aspect-ratio: 1672 / 941;

      overflow: hidden;

      background: black;

    }



    /* =========================================
       모든 장면 이미지
       ========================================= */

    .scene {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      opacity: 0;

      pointer-events: none;

    }



    /* 첫 번째 장면만 처음부터 보이게 */

    .scene01 {
      opacity: 1;
    }



    /* =========================================
       처음 SCROLL 안내
       ========================================= */

    .scroll-guide {

      position: absolute;

      left: 50%;
      bottom: 35px;

      transform: translateX(-50%);

      z-index: 100;

      color: white;

      font-size: 14px;

      letter-spacing: 3px;

      padding: 10px 18px;

      border-radius: 30px;

      background: rgba(0, 0, 0, 0.38);

      backdrop-filter: blur(5px);

      pointer-events: none;

    }



    /* =========================================
       투명 클릭 영역
       ========================================= */

    .hotspot {

      position: absolute;

      z-index: 200;

      padding: 0;
      margin: 0;

      border: none;

      background: transparent;

      cursor: pointer;

      opacity: 0;

      pointer-events: none;

    }



    /* =========================================
       10번 이미지
       빨간 닫기 버튼 위치
       ========================================= */

    #closeMailButton {

      left: 20.4%;
      top: 10.1%;

      width: 1.6%;
      height: 2.8%;

    }



    /* =========================================
       11번 이미지
       파란 시스템 종료 버튼 위치
       ========================================= */

    #shutdownButton {

      left: 54.6%;
      top: 49.4%;

      width: 8.4%;
      height: 4.5%;

    }


  </style>

</head>



<body>



  <section class="office">


    <div class="stage">


      <!-- 01 -->

      <img
        src="images/01.png"
        class="scene scene01"
        alt=""
      >


      <!-- 02 -->

      <img
        src="images/02.png"
        class="scene scene02"
        alt=""
      >


      <!-- 03 -->

      <img
        src="images/03.png"
        class="scene scene03"
        alt=""
      >


      <!-- 04 -->

      <img
        src="images/04.png"
        class="scene scene04"
        alt=""
      >


      <!-- 05 -->

      <img
        src="images/05.png"
        class="scene scene05"
        alt=""
      >


      <!-- 06 -->

      <img
        src="images/06.png"
        class="scene scene06"
        alt=""
      >


      <!-- 07 -->

      <img
        src="images/07.png"
        class="scene scene07"
        alt=""
      >


      <!-- 08 -->

      <img
        src="images/08.png"
        class="scene scene08"
        alt=""
      >


      <!-- 09 -->

      <img
        src="images/09.png"
        class="scene scene09"
        alt=""
      >


      <!-- 10 : 빨간 닫기 버튼 있는 화면 -->

      <img
        src="images/10.png"
        class="scene scene10"
        alt=""
      >


      <!-- 11 : 메일 닫은 후 -->

      <img
        src="images/11.png"
        class="scene scene11"
        alt=""
      >


      <!-- 12 : 시스템 종료 후 -->

      <img
        src="images/12.png"
        class="scene scene12"
        alt=""
      >



      <!-- 처음 SCROLL 안내 -->

      <div class="scroll-guide">

        SCROLL TO PASS TIME ↓

      </div>



      <!-- 10번 이미지 빨간 닫기 버튼 -->

      <button
        id="closeMailButton"
        class="hotspot"
        aria-label="메일 닫기">
      </button>



      <!-- 11번 이미지 파란 시스템 종료 버튼 -->

      <button
        id="shutdownButton"
        class="hotspot"
        aria-label="시스템 종료">
      </button>


    </div>


  </section>



  <!-- GSAP -->

  <script
    src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js">
  </script>


  <!-- ScrollTrigger -->

  <script
    src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js">
  </script>



  <script>


    /* =========================================
       ScrollTrigger 활성화
       ========================================= */

    gsap.registerPlugin(ScrollTrigger);



    /* =========================================
       필요한 요소 가져오기
       ========================================= */

    const closeMailButton =
      document.querySelector("#closeMailButton");

    const shutdownButton =
      document.querySelector("#shutdownButton");

    const scene11 =
      document.querySelector(".scene11");

    const scene12 =
      document.querySelector(".scene12");



    /* =========================================
       클릭 인터랙션 시작 여부

       반드시 timeline보다 위에 있어야 함
       ========================================= */

    let interactionStarted = false;



    /* =========================================
       01 ~ 10 스크롤 타임라인
       ========================================= */

    const timeline = gsap.timeline({

      scrollTrigger: {

        trigger: ".office",

        start: "top top",

        end: "+=9000",

        scrub: true,

        pin: true,

        anticipatePin: 1,


        /* 10번 장면에 도착하면
           빨간 버튼 클릭 가능 */

        onUpdate: function(self) {


          if (!interactionStarted) {


            if (self.progress > 0.98) {

              closeMailButton.style.opacity = "1";

              closeMailButton.style.pointerEvents = "auto";

            }


            else {

              closeMailButton.style.opacity = "0";

              closeMailButton.style.pointerEvents = "none";

            }


          }


        }


      }


    });

    /* =========================================
   01 화면 유지
   ========================================= */

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   01 → 02
   ========================================= */

timeline.set(".scene01", {
  opacity: 0
});

timeline.set(".scene02", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   02 → 03
   ========================================= */

timeline.set(".scene02", {
  opacity: 0
});

timeline.set(".scene03", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   03 → 04
   ========================================= */

timeline.set(".scene03", {
  opacity: 0
});

timeline.set(".scene04", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   04 → 05
   ========================================= */

timeline.set(".scene04", {
  opacity: 0
});

timeline.set(".scene05", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   05 → 06
   ========================================= */

timeline.set(".scene05", {
  opacity: 0
});

timeline.set(".scene06", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   06 → 07
   ========================================= */

timeline.set(".scene06", {
  opacity: 0
});

timeline.set(".scene07", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   07 → 08
   ========================================= */

timeline.set(".scene07", {
  opacity: 0
});

timeline.set(".scene08", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   08 → 09
   ========================================= */

timeline.set(".scene08", {
  opacity: 0
});

timeline.set(".scene09", {
  opacity: 1
});

timeline.to({}, {
  duration: 1.8
});


/* =========================================
   09 → 10
   ========================================= */

timeline.set(".scene09", {
  opacity: 0
});

timeline.set(".scene10", {
  opacity: 1
});


/* =========================================
   10번 화면 유지
   ========================================= */

timeline.to({}, {
  duration: 2
});

      

    



    /* =========================================
       SCROLL 문구

       처음에는 보이고
       스크롤 시작하면 바로 사라짐
       ========================================= */

    let scrollGuideHidden = false;


    window.addEventListener(
      "scroll",
      function () {


        if (
          !scrollGuideHidden &&
          window.scrollY > 5
        ) {


          scrollGuideHidden = true;


          gsap.to(
            ".scroll-guide",
            {

              opacity: 0,

              duration: 0.2,

              ease: "power2.out",

              onComplete: function () {

                document
                  .querySelector(".scroll-guide")
                  .style.display = "none";

              }

            }
          );


        }


      }
    );



    /* =========================================
       10번 장면

       빨간 닫기 버튼 클릭
       → 11번 이미지
       ========================================= */

    closeMailButton.addEventListener(
      "click",
      function () {


        interactionStarted = true;



        /* 빨간 버튼 클릭 비활성화 */

        closeMailButton.style.pointerEvents = "none";

        closeMailButton.style.opacity = "0";



        /* 10 → 11 */

        gsap.to(
          scene11,
          {

            opacity: 1,

            duration: 0.35,

            ease: "power1.out",

            onComplete: function () {


              /* 파란 시스템 종료 버튼 활성화 */

              shutdownButton.style.opacity = "1";

              shutdownButton.style.pointerEvents = "auto";


            }


          }
        );


      }
    );



    /* =========================================
       11번 장면

       시스템 종료 클릭
       → 12번 이미지
       ========================================= */

    shutdownButton.addEventListener(
      "click",
      function () {


        /* 두 번 클릭 방지 */

        shutdownButton.style.pointerEvents = "none";

        shutdownButton.style.opacity = "0";



        /* 11 → 12 */

        gsap.to(
          scene12,
          {

            opacity: 1,

            duration: 0.6,

            ease: "power2.inOut"

          }
        );


      }
    );


  </script>


</body>

</html>
